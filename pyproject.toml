[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "roofsolar"
version = "0.1.0"
description = "3D roof reconstruction and flush-mounted solar-panel placement from DSM + ortho imagery"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "obtype" }]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "rasterio>=1.3",
    "opencv-python-headless>=4.8",
    "shapely>=2.0",
    "matplotlib>=3.5",
    "plotly>=5.18",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
roofsolar = "roofsolar.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
